# Release workflow for linuxmuster-prepare
#
# Usage: Copy this file into the linuxmuster-prepare repository:
#   .github/workflows/release.yml
#
# Version and target distribution are read automatically from the first line
# of debian/changelog. Example:
#   linuxmuster-prepare (7.3.5-0) lmn73; urgency=medium
#
# Required repository secrets:
#   REPO_SSH_KEY    GitHub SSH key for the edulution-io/edulution-package-server
#                   repository
#
# thomas@linuxmuster.net
# 20260427

name: Release

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Select runner image
        id: image
        run: |
          DIST=$(dpkg-parsechangelog -S Distribution)
          NUM="${DIST#lmn}"
          if [ "${NUM:-0}" -ge 74 ] 2>/dev/null; then
            echo "image=ghcr.io/linuxmuster/lmndev-runner:latest" >> "$GITHUB_OUTPUT"
          else
            echo "image=ghcr.io/linuxmuster/lmndev-runner:24.04" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: resolve
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.resolve.outputs.image }}
      options: --user root

    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      distribution: ${{ steps.meta.outputs.distribution }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: build

      - name: Read version and distribution from debian/changelog
        id: meta
        working-directory: build
        run: |
          VERSION="$(dpkg-parsechangelog -S Version)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # git refuses both ':' and '~' in a refname, and the fork version
          # carries both: the epoch "1:" and the suffix "~edu" (see
          # debian/changelog). The tag spells the version without the epoch
          # and with a dash, 1:7.4.24~edu -> 7.4.24-edu, while the package
          # keeps the version it was built with.
          echo "tag=${VERSION#*:}" | tr '~' '-' >> "$GITHUB_OUTPUT"
          echo "distribution=$(dpkg-parsechangelog -S Distribution)" >> "$GITHUB_OUTPUT"

      - name: Build package
        run: /opt/lmndev/build/linuxmuster-prepare.sh
        env:
          OUTPUT_DIR: ${{ github.workspace }}/output

      - name: Upload packages as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: output/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: packages/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          files: packages/*.deb
          generate_release_notes: true

  publish:
    needs: [build, release]
    runs-on: ubuntu-latest

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: packages/

      - name: Clone archive repository
        uses: actions/checkout@v4
        with:
          repository: edulution-io/edulution-package-server
          ssh-key: ${{ secrets.REPO_SSH_KEY }}
          path: deb

      - name: Publish packages (${{ needs.build.outputs.distribution }})
        run: |
          PACKAGE="linuxmuster-prepare"
          DISTRIBUTION="${{ needs.build.outputs.distribution }}"
          VERSION="${{ needs.build.outputs.version }}"

          # The package server's suites are Ubuntu codenames, the changelog
          # keeps the linuxmuster generation. Only 7.4 on Ubuntu 26.04 is
          # maintained, so anything else is a mistake and must not be
          # published to the wrong suite.
          case "$DISTRIBUTION" in
            lmn74) CODENAME="resolute" ;;
            *) echo "Unexpected distribution '$DISTRIBUTION' in debian/changelog" >&2
               exit 1 ;;
          esac

          # A branch name may not contain ':' or '~', and the fork version
          # carries both: the epoch and the ~edu suffix.
          BRANCH="$(echo "$PACKAGE-$CODENAME-$VERSION" | tr ':~' '--')"

          mkdir -p "deb/packages/$PACKAGE/$CODENAME"
          rm -rf "deb/packages/$PACKAGE/$CODENAME/"*
          cp packages/* "deb/packages/$PACKAGE/$CODENAME/"

          cd deb
          git config user.name github-actions
          git config user.email github-actions@github.com
          git checkout -b "update/$BRANCH"
          git add .
          git commit -m "Update $PACKAGE/$CODENAME to $VERSION (by GitHub Actions)"
          git push --set-upstream origin "update/$BRANCH"
